name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The suite runs on in-memory SQLite via backend/settings_test.py, so no
      # Postgres or Redis service is needed here.
      - name: Tests
        run: pytest --cov=. --cov-report=term-missing

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run --settings=backend.settings_test

      - name: Deploy checks
        env:
          # Long enough and varied enough to satisfy security.W009 — the check is
          # the point, so a throwaway key must not trip it.
          DJANGO_SECRET_KEY: ci-9f3Kq7xT2wZm4RvB8hLpY6cJdN1sQeUgA5oXiV0zHnMk3trF
          POSTGRES_PASSWORD: ci
          DJANGO_DEBUG: "False"
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Not gating on lint yet: 193 pre-existing findings live in files the
      # phase 3 redesign replaces. Reported, not enforced.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend image builds
        run: docker build --target prod ./backend
